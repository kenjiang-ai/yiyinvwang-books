<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>一一女王绘本故事分享</title>
<meta name="description" content="跟着一一女王，每天一本互动绘本，自己看世界">
<meta name="theme-color" content="#FBF6EE">
<meta property="og:title" content="一一女王绘本故事分享">
<meta property="og:description" content="跟着一一女王，每天一本互动绘本，点开就能自己读">
<meta property="og:image" content="https://kenjiang-ai.github.io/yiyinvwang-books/share.jpg">
<meta property="og:type" content="website">
<link rel="apple-touch-icon" href="share.jpg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/app.css?v=6">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10.4 5.2 8.3 4.7 5.5 4.7 4.7 4.7 4 5.4 4 6.2v11.1c0 .8.7 1.5 1.5 1.5 2.8 0 4.9.5 6.5 1.7 1.6-1.2 3.7-1.7 6.5-1.7.8 0 1.5-.7 1.5-1.5V6.2c0-.8-.7-1.5-1.5-1.5-2.8 0-4.9.5-6.5 1.8z"/>
          <path d="M12 6.5v14"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong id="siteTitle">一一女王绘本故事分享</strong>
        <small>每天一本 · 自己看世界</small>
      </span>
    </div>
    <button id="btnCalendar" class="icon-btn" type="button" aria-label="打开阅读日历">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/>
        <path d="M8 3.5v4M16 3.5v4M3.5 10.5h17"/>
      </svg>
    </button>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="search">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="searchInput" class="search-input" type="search" placeholder="搜书名、故事内容或分类…" enterkeyhint="search" aria-label="搜索绘本" autocomplete="off">
      <button id="searchClear" class="search-clear" type="button" aria-label="清除搜索" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="catChips" class="cat-chips" role="tablist" aria-label="按分类筛选"></div>
  </div>

  <main id="main" class="main"></main>

  <footer class="foot">
    <span id="footNote">正在加载…</span>
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-label="阅读日历">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <button id="calPrev" class="cal-nav" type="button" aria-label="上个月">‹</button>
      <h2 id="calTitle">2026 年 10 月</h2>
      <button id="calNext" class="cal-nav" type="button" aria-label="下个月">›</button>
    </div>
    <div class="cal-weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div id="calGrid" class="cal-grid"></div>
    <div class="sheet-foot">
      <span><i class="dot dot-on"></i>有绘本</span>
      <span><i class="dot dot-today"></i>今天</span>
      <button id="calLatest" class="text-btn" type="button">回到今天</button>
    </div>
  </section>
</div>

<div id="reader" class="reader" hidden>
  <div class="reader-bar">
    <button id="readerBack" class="reader-back" type="button" aria-label="返回书架">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </button>
    <span id="readerTitle" class="reader-title">绘本</span>
    <button id="readerClose" class="icon-btn reader-close" type="button" aria-label="关闭阅读">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="reader-body">
    <iframe id="readerFrame" class="reader-frame" title="绘本阅读" allow="autoplay" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups"></iframe>
    <div id="readerLoading" class="reader-loading" hidden>
      <div class="rl-rocket" aria-hidden="true">
        <span class="rl-star rl-s1"></span>
        <span class="rl-star rl-s2"></span>
        <span class="rl-star rl-s3"></span>
        <svg viewBox="0 0 48 48" width="64" height="64"><path d="M24 4c7 6 10 14 10 22l-10 14L14 26c0-8 3-16 10-22z" fill="#C9714D"/><circle cx="24" cy="20" r="4.2" fill="#fff"/><path d="M15 30l-6 5 8-1zM33 30l6 5-8-1z" fill="#7E9678"/><path d="M21 40l3 6 3-6z" fill="#E0A55F"/></svg>
      </div>
      <p class="rl-title">绘本正在飞来…</p>
      <div class="rl-progress"><div id="rlBarFill" class="rl-bar-fill"></div></div>
      <p id="rlPct" class="rl-pct"></p>
      <p id="rlTeaser" class="rl-teaser"></p>
      <button id="rlRetry" class="rl-retry" type="button" hidden>网络有点慢，点我重试</button>
      <a id="rlOpen" class="rl-open" href="#" target="_blank" rel="noopener" hidden>或在新页面打开</a>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/app.js?v=11"></script>
</body>
</html>
